name: Bee Backend
version: "0.1.0"
slug: bee_backend
description: Bee backend service for Home Assistant
url: https://github.com/finestdice17/bee-homeassistant-addon
startup: services
boot: auto
init: false
host_network: true
homeassistant_api: false
ingress: false
panel_icon: mdi:bee
arch:
  - aarch64
  - amd64

options:
  bee_binary_path: "/usr/local/bin/bee"
  webhook_url: ""
schema:
  bee_binary_path: str
  webhook_url: str?

ports:
  8130/tcp: 8130
ports_description:
  8130/tcp: Bee backend API
